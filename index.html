    /* パステルピンク＆ライラックを基調としたデザイン変数 */
    :root {
      --bg: #fff7fb;
      --bg-grad: radial-gradient(circle at top left, #ffeef6 0%, #f5efff 50%, #fffaf2 100%);
      --surface: #ffffff;
      --surface-soft: #fff0f7;
      --surface-lilac: #f4efff;
      --text: #2b1e38;
      --muted: #756585;
      --border: #f3d9e8;
      --accent: #ff6fa5;
      --accent-2: #8b5cf6;
      --accent-soft: #ffe4ef;
      --accent-ink: #ffffff;
      --star: #ffb703;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(255, 111, 165, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }

    .app {
      max-width: 1040px;
      margin: 0 auto;
      padding: 22px 16px 76px;
    }

    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 18px 20px 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }

    .testplay-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .tab-btn {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: var(--accent-ink);
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 111, 165, 0.28);
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="search"],
    select,
    textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      background: #fffcfe;
      color: var(--text);
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 111, 165, 0.15);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .chip:hover {
      border-color: var(--accent);
    }

    .chip.active {
      background: var(--accent-soft);
      color: #d63373;
      border-color: var(--accent);
      font-weight: 800;
    }

    .meta-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: #f7b8d2;
    }

    .item-top {

      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-meta {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

      border: none;
      background: var(--surface-soft);

      width: 30px;
      height: 30px;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      color: #d5c5d8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .star-btn.starred {
      color: var(--star);
      background: #fff6db;
    }

    .item-title {
      margin: 0;
      font-size: 1.03rem;
      font-weight: 800;
      color: var(--text);
    }

      color: var(--accent-2);

      background: var(--surface-lilac);

      margin: 0;
      font-size: 0.87rem;
      color: var(--text);

      flex-wrap: wrap;
      margin-top: auto;

      font-weight: 700;

      background: var(--surface);
      color: var(--text);

      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;

      transition: all 0.12s ease;

    .btn:hover {
      border-color: var(--accent);
      background: var(--surface-soft);

    .btn.primary {

      color: var(--accent-ink);
      border-color: transparent;
    }

    .btn.small {

      font-size: 0.78rem;

      color: var(--text);

      flex-wrap: wrap;

      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;

      color: var(--accent-ink);
      border-color: transparent;
      font-weight: 800;

      background: var(--surface-soft);
      border: 1.5px solid #f7b8d2;
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 14px;

      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;

      flex-wrap: wrap;

      transform: translateX(-50%);
      background: #2b1e38;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
    }

    .empty-box {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>

    const memStore = { favs: { dramas: [], mainChars: [], supporting: [] }, customWorks: [], savedDiagnostics: [] };

    function loadFavs() {
      try {
        const raw = localStorage.getItem(STORAGE_FAV);
        if (raw) {
          const parsed = JSON.parse(raw);
          memStore.favs.dramas = Array.isArray(parsed.dramas) ? parsed.dramas : [];
          memStore.favs.mainChars = Array.isArray(parsed.mainChars) ? parsed.mainChars : [];
          memStore.favs.supporting = Array.isArray(parsed.supporting) ? parsed.supporting : [];
        }
      } catch (e) {}
    }

    function saveFavs() {
      try {
        localStorage.setItem(STORAGE_FAV, JSON.stringify(memStore.favs));
      } catch (e) {}
    }

    function loadCustomWorks() {
      try {
        const raw = localStorage.getItem(STORAGE_CUSTOM_WORKS);
        if (raw) {
          const list = JSON.parse(raw);
          if (Array.isArray(list)) {
            memStore.customWorks = list;
            return list;
          }
        }
      } catch (e) {}
      return memStore.customWorks;
    }

    function saveCustomWorks(list) {
      memStore.customWorks = list;
      try {
        localStorage.setItem(STORAGE_CUSTOM_WORKS, JSON.stringify(list));
      } catch (e) {}
    }

    function loadSavedDiagnostics() {
      try {
        const raw = localStorage.getItem(STORAGE_SAVED_DIAG);
        if (raw) {
          const list = JSON.parse(raw);
          if (Array.isArray(list)) {
            memStore.savedDiagnostics = list;
            return list;
          }
        }
      } catch (e) {}
      return memStore.savedDiagnostics;
    }

    function saveSavedDiagnostics(list) {
      memStore.savedDiagnostics = list;
      try {
        localStorage.setItem(STORAGE_SAVED_DIAG, JSON.stringify(list));
      } catch (e) {}
    }

    function getTopTagsFromScores(scores) {
      return Object.entries(scores || {})
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3)
        .map(([tag]) => tag);
    }

    function buildDiagnosisSnapshot(mode) {
      const isChar = mode === "char";
      const qList = isChar ? getCharQuestionsByRole(state.charRoleFilter) : WORK_QUESTIONS;
      const ansObj = isChar ? state.charAnswers : state.workAnswers;
      const scores = {};

      qList.forEach((q, idx) => {
        const chosen = ansObj[idx];
        if (chosen !== undefined && q.options[chosen]) {
          const tag = q.options[chosen].tag;
          scores[tag] = (scores[tag] || 0) + 1;
        }
      });

      const topTags = getTopTagsFromScores(scores);

      if (isChar) {
        let pool = [
          ...MAIN_CHARACTERS.map(p => ({ ...p, _kind: "main" })),
          ...SUPPORTING_CAST.map(p => ({ ...p, _kind: "sup" }))
        ];
        if (state.charRoleFilter === "main") {
          pool = pool.filter(p => p._kind === "main");
        } else if (state.charRoleFilter === "sup") {
          pool = pool.filter(p => p._kind === "sup");
        }
        const ranked = pool.map(p => {
          const drama = getAllDramas().find(d => d.id === p.dramaId);
          const tags = drama ? drama.tags : [];
          const score = tags.reduce((s, t) => s + (scores[t] || 0), 0);
          return { ...p, score };
        }).sort((a, b) => b.score - a.score).slice(0, 4);

        const roleLabel = state.charRoleFilter === "main"
          ? "メインキャラ編"
          : state.charRoleFilter === "sup"
            ? "脇役キャラ編"
            : "すべて（共通）";

        return {
          mode: "char",
          title: `推しキャラ診断（${roleLabel}）`,
          topTags: topTags.length ? topTags : ["甘々・胸キュン"],
          candidates: ranked.map(p => `${p.name}（${p.dramaTitle}）`),
          ranked
        };
      } else {
        const ranked = getAllDramas().map(d => {
          const score = (d.tags || []).reduce((s, t) => s + (scores[t] || 0), 0) + d.popularity * 0.05;
          return { ...d, score };
        }).sort((a, b) => b.score - a.score).slice(0, 4);

        return {
          mode: "work",
          title: "推し作品診断（12問）",
          topTags: topTags.length ? topTags : ["甘々・胸キュン"],
          candidates: ranked.map(d => d.title),
          ranked
        };
      }
    }

    function formatDiagnosisShareText(entry) {
      const tagsText = (entry.topTags || []).map(t => `#${t}`).join(" ");
      const candText = (entry.candidates || []).map((c, idx) => `${idx + 1}. ${c}`).join(" / ");
      return `【推しBLドラマ＆キャラ図鑑】${entry.title}
傾向：${tagsText || "推し傾向"}
おすすめ候補：${candText}`;
    }

    function copyTextFallback(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function shareDiagnosisText(text, title) {
      if (navigator && typeof navigator.share === "function") {
        try {
          await navigator.share({
            title: title || "推しBLドラマ＆キャラ図鑑 診断結果",
            text
          });
          showToast("診断結果を共有しました");
          return;
        } catch (err) {
          if (err && err.name === "AbortError") {
            return;
          }
        }
      }
      const copied = copyTextFallback(text);
      if (copied) {
        showToast("共有用テキストをクリップボードにコピーしました");
      } else {
        showToast("コピーに失敗しました");
      }
    }

    function saveCurrentDiagnosis(mode) {
      const snap = buildDiagnosisSnapshot(mode);
      const item = {
        id: "diag-" + Date.now(),
        mode: snap.mode,
        title: snap.title,
        topTags: snap.topTags,
        candidates: snap.candidates,
        savedAt: new Date().toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
      };
      const next = [item, ...loadSavedDiagnostics()];
      saveSavedDiagnostics(next);
      showToast("診断結果を★推しリストに保存しました");
    }

    function shareCurrentDiagnosis(mode) {
      const snap = buildDiagnosisSnapshot(mode);
      const text = formatDiagnosisShareText(snap);
      shareDiagnosisText(text, snap.title);
    }

    function copySavedDiagnosis(id) {
      const found = loadSavedDiagnostics().find(d => d.id === id);
      if (!found) return;
      const text = formatDiagnosisShareText(found);
      const ok = copyTextFallback(text);
      showToast(ok ? "共有テキストをコピーしました" : "コピーに失敗しました");
    }

    function deleteSavedDiagnosis(id) {
      const next = loadSavedDiagnostics().filter(d => d.id !== id);
      saveSavedDiagnostics(next);
      showToast("保存した診断結果を削除しました");
      render();
    }

    function getAllDramas() {
      const base = RAW_BL_DRAMAS.map(([id, title, year, era, popularity, castArr, tags, platform, summary]) => ({
        id,
        title,
        year,
        era,
        popularity,
        cast: castArr.map(([name, group]) => ({ name, group })),
        tags,
        platform,
        summary,
        isCustom: false
      }));
      return [...loadCustomWorks(), ...base];
    }

    function formatCast(castList) {
      return (castList || [])
        .map(c => (c.group ? `${c.name}（${c.group}）` : c.name))
        .join(" × ");
    }

    function formatActor(actor) {
      return actor && actor.group ? `${actor.name}（${actor.group}）` : (actor ? actor.name : "");
    }

    function getAllSingleGroups() {
      const set = new Set();
      getAllDramas().forEach(d => {
        (d.cast || []).forEach(c => {
          if (c.group && !c.group.includes("/") && !c.group.includes("／")) {
            set.add(c.group);
          }
        });
      });
      MAIN_CHARACTERS.forEach(p => {
        if (p.actor && p.actor.group && !p.actor.group.includes("/") && !p.actor.group.includes("／")) {
          set.add(p.actor.group);
        }
      });
      SUPPORTING_CAST.forEach(p => {
        if (p.actor && p.actor.group && !p.actor.group.includes("/") && !p.actor.group.includes("／")) {
          set.add(p.actor.group);
        }
      });
      return [...set].sort((a, b) => a.localeCompare(b, "ja"));
    }

    function getSupportingSingleGroups() {
      const set = new Set();
      SUPPORTING_CAST.forEach(p => {
        if (p.actor && p.actor.group && !p.actor.group.includes("/") && !p.actor.group.includes("／")) {
          set.add(p.actor.group);
        }
      });
      return [...set].sort((a, b) => a.localeCompare(b, "ja"));
    }

    // 選択中の区分に応じて12問を切り替え
    function getCharQuestionsByRole(roleFilter) {
      if (roleFilter === "main") return MAIN_CHAR_QUESTIONS;
      if (roleFilter === "sup") return SUP_CHAR_QUESTIONS;
      return ALL_CHAR_QUESTIONS;
    }

    function getCharQuizHeadingByRole(roleFilter) {
      if (roleFilter === "main") return "推しキャラ診断：メインキャラ編（全12問）";
      if (roleFilter === "sup") return "推しキャラ診断：脇役キャラ編（全12問）";
      return "推しキャラ診断：すべて（共通12問）";
    }

    function setCharRoleFilter(role) {
      if (state.charRoleFilter === role) return;
      state.charRoleFilter = role;
      state.charAnswers = {};
      state.charResultShown = false;
      render();
    }

    let state = {
      tab: "dramas",
      search: "",
      group: "",
      era: "",
      tag: "すべて",
      mainSearch: "",
      mainGroup: "",
      supSearch: "",
      supGroup: "",
      supRole: "すべて",
      charRoleFilter: "all",
      charAnswers: {},
      charResultShown: false,
      workAnswers: {},
      workResultShown: false
    };

    function toggleFav(kind, id) {
      const arr = memStore.favs[kind];
      const idx = arr.indexOf(id);
      if (idx >= 0) {
        arr.splice(idx, 1);
        showToast("★推しリストから外しました");
      } else {
        arr.push(id);
        showToast("★推しリストに追加しました");
      }
      saveFavs();
      render();
    }

    function isFav(kind, id) {
      return memStore.favs[kind].includes(id);
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function jumpToDrama(dramaId) {
      state.tab = "dramas";
      state.search = "";
      state.group = "";
      state.era = "";
      state.tag = "すべて";
      updateNav();
      render();
      requestAnimationFrame(() => {
        const el = document.getElementById("drama-" + dramaId);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.style.outline = "2px solid var(--accent)";
          setTimeout(() => { el.style.outline = ""; }, 1500);
        }
      });
    }

    function updateNav() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === state.tab);
      });
    }

    function matchesDramaFilter(d) {
      if (state.era && d.era !== state.era) return false;
      if (state.tag !== "すべて" && !(d.tags || []).includes(state.tag)) return false;
      if (state.group) {
        const hasGroup = (d.cast || []).some(c => c.group === state.group);
        if (!hasGroup) return false;
      }
      const kw = state.search.trim().toLowerCase();
      if (kw) {
        const hay = `${d.title} ${d.year} ${d.era} ${formatCast(d.cast)} ${d.summary} ${d.platform} ${(d.tags || []).join(" ")}`.toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    }

    function applyLiveDramaFilter() {
      const all = getAllDramas();
      let visibleCount = 0;
      all.forEach(d => {
        const card = document.getElementById("drama-" + d.id);
        if (!card) return;
        const ok = matchesDramaFilter(d);
        card.style.display = ok ? "" : "none";
        if (ok) visibleCount++;
      });
      const countEl = document.getElementById("dramaCountLabel");
      if (countEl) {
        countEl.textContent = `${visibleCount} / ${all.length} BL作品を表示中`;
      }
      const emptyEl = document.getElementById("dramaEmptyBox");
      if (emptyEl) {
        emptyEl.style.display = visibleCount === 0 ? "" : "none";
      }
    }

              </div>
              <div>
                <button type="button" class="btn" onclick="state.supSearch=''; state.supGroup=''; state.supRole='すべて'; render();">条件リセット</button>
              </div>
            </div>
            <div class="chip-row">
              ${SUP_ROLES.map(r => `<button type="button" class="chip ${state.supRole === r ? "active" : ""}" onclick="state.supRole = '${escapeHtml(r)}'; render();">${escapeHtml(r)}</button>`).join("")}
            </div>
          </div>
          <div class="meta-line">
            <span>${filtered.length} / ${SUPPORTING_CAST.length} 人の脇役を表示中</span>
          </div>
        </div>
        ${filtered.length ? `<div class="grid">${filtered.map(renderSupportingCard).join("")}</div>` : `<div class="empty-box">該当する脇役が見つかりませんでした。</div>`}
      `;
    }

    function renderQuizSection(mode) {
      const isChar = mode === "char";
      const qList = isChar ? getCharQuestionsByRole(state.charRoleFilter) : WORK_QUESTIONS;
      const ansObj = isChar ? state.charAnswers : state.workAnswers;
      const shown = isChar ? state.charResultShown : state.workResultShown;
      const titleText = isChar ? getCharQuizHeadingByRole(state.charRoleFilter) : "推し作品診断（全12問）";
      const btnText = isChar ? "推しキャラ結果を見る" : "推し作品結果を見る";

      const scores = {};
      qList.forEach((q, idx) => {
        const chosen = ansObj[idx];
        if (chosen !== undefined && q.options[chosen]) {
          const tag = q.options[chosen].tag;
          scores[tag] = (scores[tag] || 0) + 1;
        }
      });

      let resultHtml = "";
      if (shown) {
        const snap = buildDiagnosisSnapshot(mode);
        if (isChar) {
          resultHtml = `
            <div class="result-panel">
              <div class="result-header">
                <h3 style="margin:0;">あなたにおすすめの推しキャラ候補</h3>
                <div class="result-actions">
                  <button type="button" class="btn small primary" onclick="saveCurrentDiagnosis('char')">診断結果を保存</button>
                  <button type="button" class="btn small" onclick="shareCurrentDiagnosis('char')">診断結果を共有</button>
                </div>
              </div>
              <div class="tags" style="margin-bottom:12px;">
                ${snap.topTags.map(t => `<span class="tag">マッチ傾向：${escapeHtml(t)}</span>`).join("")}
              </div>
              <div class="grid">${snap.ranked.map(p => p._kind === "main" ? renderMainCharCard(p) : renderSupportingCard(p)).join("")}</div>
            </div>
          `;
        } else {
          resultHtml = `
            <div class="result-panel">
              <div class="result-header">
                <h3 style="margin:0;">あなたにおすすめの推しBL作品候補</h3>
                <div class="result-actions">
                  <button type="button" class="btn small primary" onclick="saveCurrentDiagnosis('work')">診断結果を保存</button>
                  <button type="button" class="btn small" onclick="shareCurrentDiagnosis('work')">診断結果を共有</button>
                </div>
              </div>
              <div class="tags" style="margin-bottom:12px;">
                ${snap.topTags.map(t => `<span class="tag">マッチ傾向：${escapeHtml(t)}</span>`).join("")}
              </div>
              <div class="grid">${snap.ranked.map(renderDramaCard).join("")}</div>
            </div>
          `;
        }
      }

      const roleSelectorHtml = isChar ? `
        <div style="margin:10px 0 14px; padding:12px; background:var(--surface-soft); border-radius:14px;">
          <div class="field-label" style="margin-bottom:8px;">診断する推しタイプを選択（質問内容が切り替わります）</div>
          <div class="chip-row">
            <button type="button" class="chip ${state.charRoleFilter === "all" ? "active" : ""}" onclick="setCharRoleFilter('all')">すべて（共通12問）</button>
            <button type="button" class="chip ${state.charRoleFilter === "main" ? "active" : ""}" onclick="setCharRoleFilter('main')">メインキャラの推し（主役専用12問）</button>
            <button type="button" class="chip ${state.charRoleFilter === "sup" ? "active" : ""}" onclick="setCharRoleFilter('sup')">脇役キャラの推し（脇役専用12問）</button>
          </div>
        </div>
      ` : "";

      return `
        <div class="card">
          <h2 style="margin:0 0 8px;">${titleText}</h2>
          ${roleSelectorHtml}
          ${qList.map((item, qIdx) => `
            <div class="quiz-q-card">
              <div class="quiz-q-title">${escapeHtml(item.q)}</div>
              <div class="opt-grid">
                ${item.options.map((opt, oIdx) => {
                  const sel = ansObj[qIdx] === oIdx;
                  return `<button type="button" class="opt-btn ${sel ? "selected" : ""}" onclick="pickQuizOption('${mode}', ${qIdx}, ${oIdx})">${escapeHtml(opt.label)}</button>`;
                }).join("")}
              </div>
            </div>
          `).join("")}
          <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
            <button type="button" class="btn primary" onclick="submitQuiz('${mode}')">${btnText}</button>
            <button type="button" class="btn" onclick="clearQuiz('${mode}')">リセット</button>
          </div>
          ${resultHtml}
        </div>
      `;
    }

    function pickQuizOption(mode, qIdx, oIdx) {
      if (mode === "char") {
        state.charAnswers[qIdx] = oIdx;
      } else {
        state.workAnswers[qIdx] = oIdx;
      }
      render();
    }

    function submitQuiz(mode) {
      if (mode === "char") {
        state.charResultShown = true;
      } else {
        state.workResultShown = true;
      }
      render();
    }

    function clearQuiz(mode) {
      if (mode === "char") {
        state.charAnswers = {};
        state.charResultShown = false;
      } else {
        state.workAnswers = {};
        state.workResultShown = false;
      }
      render();
    }

    function renderAddWorkView() {
      const customList = loadCustomWorks();
      return `
        <div class="card">
          <h2 style="margin:0 0 10px;">BL作品を追加する</h2>
          <form onsubmit="handleAddWorkSubmit(event)" style="display:grid; gap:12px;">
            <div>
              <label class="field-label" for="newTitle">作品名 *</label>
              <input id="newTitle" type="text" required placeholder="例：〇〇の恋" />
            </div>
            <div class="filter-grid">
              <div>
                <label class="field-label" for="newYear">放送・公開時期</label>
                <input id="newYear" type="text" value="2026年秋" />
              </div>
              <div>
                <label class="field-label" for="newEra">年代区分</label>
                <select id="newEra">
                  <option value="2026年">2026年</option>
                  <option value="2025年">2025年</option>
                  <option value="2020〜2024年">2020〜2024年</option>
                  <option value="2019年以前">2019年以前</option>
                </select>
              </div>
              <div>
                <label class="field-label" for="newPlatform">放送・配信</label>
                <input id="newPlatform" type="text" value="配信" />
              </div>
            </div>
            <div class="filter-grid">
              <div>
                <label class="field-label" for="newCast1">キャスト1 *</label>
                <input id="newCast1" type="text" required placeholder="例：山田太郎" />
              </div>
              <div>
                <label class="field-label" for="newGroup1">グループ名1（単独・任意）</label>
                <input id="newGroup1" type="text" placeholder="例：M!LK" />
              </div>
              <div>
                <label class="field-label" for="newCast2">キャスト2</label>
                <input id="newCast2" type="text" placeholder="例：佐藤花男" />
              </div>
              <div>
                <label class="field-label" for="newGroup2">グループ名2（単独・任意）</label>
                <input id="newGroup2" type="text" placeholder="例：DXTEEN" />
              </div>
            </div>
            <div>
              <label class="field-label" for="newTags">タグ（カンマ区切り）</label>
              <input id="newTags" type="text" value="学園・青春, 甘々・胸キュン" />
            </div>
            <div>
              <label class="field-label" for="newSummary">あらすじ・見どころ</label>
              <textarea id="newSummary" placeholder="作品の概要を入力してください"></textarea>
            </div>
            <div>
              <button type="submit" class="btn primary">作品を追加して保存</button>
            </div>
          </form>
        </div>
        ${customList.length ? `
          <div class="card">
            <h3 style="margin:0 0 10px;">追加した作品（${customList.length}件）</h3>
            <div class="grid">${customList.map(renderDramaCard).join("")}</div>
          </div>
        ` : ""}
      `;
    }

    function handleAddWorkSubmit(e) {
      e.preventDefault();
      const title = document.getElementById("newTitle").value.trim();
      if (!title) return;
      const year = document.getElementById("newYear").value.trim() || "2026年";
      const era = document.getElementById("newEra").value;
      const platform = document.getElementById("newPlatform").value.trim() || "配信";
      const c1 = document.getElementById("newCast1").value.trim();
      const g1 = document.getElementById("newGroup1").value.trim();
      const c2 = document.getElementById("newCast2").value.trim();
      const g2 = document.getElementById("newGroup2").value.trim();
      const tags = document.getElementById("newTags").value.split(",").map(s => s.trim()).filter(Boolean);
      const summary = document.getElementById("newSummary").value.trim() || "ユーザー追加のBL作品。";

      const cast = [];
      if (c1) cast.push({ name: c1, group: g1 });
      if (c2) cast.push({ name: c2, group: g2 });

      const newEntry = {
        id: "custom-" + Date.now(),
        title,
        year,
        era,
        popularity: 95,
        cast,
        tags: tags.length ? tags : ["甘々・胸キュン"],
        platform,
        summary,
        isCustom: true
      };

      const next = [newEntry, ...loadCustomWorks()];
      saveCustomWorks(next);
      showToast("作品を追加しました");
      state.tab = "dramas";
      updateNav();
      render();
    }

    function deleteCustomWork(id) {
      const next = loadCustomWorks().filter(w => w.id !== id);
      saveCustomWorks(next);
      showToast("追加作品を削除しました");
      render();
    }

    function renderFavoritesView() {
      const favDramas = getAllDramas().filter(d => isFav("dramas", d.id));
      const favMain = MAIN_CHARACTERS.filter(p => isFav("mainChars", p.id));
      const favSup = SUPPORTING_CAST.filter(p => isFav("supporting", p.id));
      const savedDiags = loadSavedDiagnostics();
      return `
        <div class="card">
          <h2 style="margin:0 0 12px;">★推しリスト</h2>
          <h3 style="margin:12px 0 8px;">保存した診断結果（${savedDiags.length}件）</h3>
          ${savedDiags.length ? `
            <div class="grid" style="margin-bottom:18px;">
              ${savedDiags.map(item => `
                <article class="saved-diag-card" id="diag-${escapeHtml(item.id)}">
                  <div class="saved-diag-top">
                    <span class="item-meta">${escapeHtml(item.title)} ・ ${escapeHtml(item.savedAt || "")}</span>
                  </div>
                  <div class="tags">
                    ${(item.topTags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
                  </div>
                  <div class="saved-diag-candidates">${escapeHtml((item.candidates || []).join(" / "))}</div>
                  <div class="result-actions">
                    <button type="button" class="btn small" onclick="copySavedDiagnosis('${escapeHtml(item.id)}')">共有テキストをコピー</button>
                    <button type="button" class="btn small" onclick="deleteSavedDiagnosis('${escapeHtml(item.id)}')">削除</button>
                  </div>
                </article>
              `).join("")}
            </div>
          ` : `<p class="desc" style="color:var(--muted); margin-bottom:14px;">まだ保存した診断結果はありません。</p>`}
          <h3 style="margin:12px 0 8px;">推し作品（${favDramas.length}件）</h3>
          ${favDramas.length ? `<div class="grid">${favDramas.map(renderDramaCard).join("")}</div>` : `<p class="desc" style="color:var(--muted);">まだ推し作品がありません。</p>`}
          <h3 style="margin:18px 0 8px;">推しメインキャラ（${favMain.length}人）</h3>
          ${favMain.length ? `<div class="grid">${favMain.map(renderMainCharCard).join("")}</div>` : `<p class="desc" style="color:var(--muted);">まだ推しメインキャラがありません。</p>`}
          <h3 style="margin:18px 0 8px;">推し脇役（${favSup.length}人）</h3>
          ${favSup.length ? `<div class="grid">${favSup.map(renderSupportingCard).join("")}</div>` : `<p class="desc" style="color:var(--muted);">まだ推し脇役がありません。</p>`}
        </div>
      `;
    }

    function replayCurrentMode() {
      if (state.tab === "char-quiz") {
        clearQuiz("char");
        showToast("推しキャラ診断を最初からやり直せます");
      } else if (state.tab === "work-quiz") {
        clearQuiz("work");
        showToast("推し作品診断を最初からやり直せます");
      } else {
        resetDramaFilters();
        state.mainSearch = "";
        state.mainGroup = "";
        state.supSearch = "";
        state.supGroup = "";
        state.supRole = "すべて";
        render();
        showToast("検索・表示をリセットして最初からプレイできます");
      }
    }

    function runAutoTestPlay() {
      const dramaCount = getAllDramas().length;
      const mainCount = MAIN_CHARACTERS.length;
      const supCount = SUPPORTING_CAST.length;
      const supGroups = getSupportingSingleGroups();
      state.tab = "main-chars";
      updateNav();
      render();
      showToast(`テスト完了: ${dramaCount}作品・メイン${mainCount}人・脇役${supCount}人（脇役グループ${supGroups.length}件）`);
    }

    function render() {
      const container = document.getElementById("viewContainer");
      if (!container) return;
      if (state.tab === "dramas") container.innerHTML = renderDramasView();
      else if (state.tab === "main-chars") container.innerHTML = renderMainCharsView();
      else if (state.tab === "supporting") container.innerHTML = renderSupportingView();
      else if (state.tab === "char-quiz") container.innerHTML = renderQuizSection("char");
      else if (state.tab === "work-quiz") container.innerHTML = renderQuizSection("work");
      else if (state.tab === "add-work") container.innerHTML = renderAddWorkView();
      else if (state.tab === "favorites") container.innerHTML = renderFavoritesView();
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.tab = btn.dataset.tab;
        updateNav();
        render();
      });
    });

    const viewContainerEl = document.getElementById("viewContainer");
    if (viewContainerEl) {
      viewContainerEl.addEventListener("change", (e) => {
        const target = e.target;
        if (!target) return;
        if (target.id === "dramaGroup") {
          state.group = target.value;
          applyLiveDramaFilter();
        } else if (target.id === "dramaEra") {
          state.era = target.value;
          applyLiveDramaFilter();
        } else if (target.id === "mainGroup") {
          state.mainGroup = target.value;
          render();
        } else if (target.id === "supGroup") {
          state.supGroup = target.value;
          render();
        }
      });

      viewContainerEl.addEventListener("input", (e) => {
        const target = e.target;
        if (!target) return;
        if (target.id === "dramaSearch") {
          state.search = target.value;
          applyLiveDramaFilter();
        } else if (target.id === "mainSearch") {
          state.mainSearch = target.value;
          render();
        } else if (target.id === "supSearch") {
          state.supSearch = target.value;
          render();
        }
      });
    }

    // IME入力確定時にもライブ検索を反映
    document.addEventListener("compositionend", (e) => {
      const target = e.target;
      if (!target) return;
      if (target.id === "dramaSearch") {
        state.search = target.value;
        applyLiveDramaFilter();
      } else if (target.id === "mainSearch") {
        state.mainSearch = target.value;
        render();
      } else if (target.id === "supSearch") {
        state.supSearch = target.value;
        render();
      }
    });

    loadFavs();
    loadSavedDiagnostics();
    updateNav();
    render();
  </script>
</body>
</html>
